<!DOCTYPE html>
<html>
    <head>
        <title>Layout Practice</title>
        <style>
           body {
            margin: 0;
            font-family: Arial, sans-serif;
           }

           .navbar{
                display: flex;
                justify-content: space-between;
                align-items: center;
                background-color: darkblue;
                color: white;
                padding: 15px 30px;
           }

           .logo{
                font-size: 24px;
                font-weight:bold;
           }

           .link{
                display: flex;
                gap: 20px;
           }

           .link a {
                color:white;
                text-decoration: none;
           }

        </style>
    </head>
    <body>
        <div class="navbar">
            <div class="logo">MySite</div>
            <div class="links">
                <a hef="#">Home</a>
                <a hef="#">About</a>
                <a hef="#">Contact</a>
            </div>
        </div>
        <h1>Welcome to my site!</h1>
    </body>
</html>
