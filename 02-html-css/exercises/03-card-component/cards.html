<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Card Components</title>
</head>
<body class="bg-gray-100 p-8">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-4xl mx-auto">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class = "font-bold mb-2">Card Title</h2>
                <p class = "text-gray-600">Description text</p>
            </div>
            <div class ="bg-white rounded-lg shadow-md flex flex-col items-center text-center p-6">
                <img src="https://via.placeholder.com/400x200" class="w-full rounded-t-lg">
                <h2 class = "font-bold mb-2">Product name</h2>
                <p class = "text-gray-600 mb-4">$29.99</p>
            <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Add to Cart</button>
            </div>
            <div class="bg-white rounded-lg shadow-md flex flex-col items-center text-center p-6">
                <img src="https://via.placeholder.com/100" class="w-24 h-24 rounded-full">
                <h2 class="font-bold mb-2 text-xl">Name</h2>
                <p class="text-gray-600 mb-4 text-sm">Job title</p>
                <p class="text-gray-600 mb-4 text-sm">Short bio</p>
            </div>
    </div>
