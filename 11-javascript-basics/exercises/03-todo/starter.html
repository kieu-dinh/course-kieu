<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 03 - Todo List Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s ease;
            font-weight: bold;
        }

        button:hover {
            background: #764ba2;
        }

        button:active {
            transform: scale(0.98);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .controls button {
            padding: 8px 15px;
            font-size: 0.9em;
            flex: 1;
            min-width: 100px;
        }

        .controls button.active {
            background: #764ba2;
            box-shadow: 0 0 0 2px #667eea;
        }

        .stats {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .todo-list {
            list-style: none;
            margin-bottom: 20px;
        }

        .todo-item {
            background: #f5f5f5;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .todo-item:hover {
            background: #efefef;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .todo-item.completed {
            opacity: 0.6;
            background: #e8f5e9;
            border-left-color: #4caf50;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .todo-text {
            flex: 1;
            font-size: 1em;
            color: #333;
            word-break: break-word;
        }

        .todo-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .todo-actions button {
            padding: 6px 12px;
            font-size: 0.85em;
            background: #dc3545;
            min-width: auto;
        }

        .todo-actions button:hover {
            background: #c82333;
        }

        .edit-btn {
            background: #17a2b8 !important;
        }

        .edit-btn:hover {
            background: #138496 !important;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 1.1em;
        }

        .clear-section {
            border-top: 2px solid #eee;
            padding-top: 20px;
            text-align: center;
        }

        .clear-section button {
            background: #ffc107;
            color: #333;
        }

        .clear-section button:hover {
            background: #e0a800;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            margin-bottom: 15px;
        }

        .modal-content input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-actions button {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Todo List Application</h1>

        <!-- Input Section -->
        <div class="input-section">
            <input
                type="text"
                id="todo-input"

                autofocus
            >
            <button id="add-btn">Add Todo</button>
        </div>

        <!-- Filter Controls -->
        <div class="controls">
            <button id="filter-all" class="filter-btn active">All</button>
            <button id="filter-active" class="filter-btn">Active</button>
            <button id="filter-completed" class="filter-btn">Completed</button>
        </div>

        <!-- Stats -->
        <div class="stats">
            <span id="active-count">0</span> active,
            <span id="total-count">0</span> total
        </div>

        <!-- Todo List -->
        <ul class="todo-list" id="todo-list"></ul>

        <!-- Empty State -->
        <div class="empty-state" id="empty-state">
            <p>No todos yet. Add one to get started!</p>
        </div>

        <!-- Clear Section -->
        <div class="clear-section">
            <button id="clear-completed-btn">Clear Completed</button>
        </div>
    </div>

    <!-- Edit Modal -->

    </div>
