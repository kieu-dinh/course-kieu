        button {

        }
        .loading {
            text-align: center;
            color: #667eea;
            padding: 20px;
            display: none;
        }
        .spinner {
            display: inline-block;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .results {
            list-style: none;
        }
        .result-item {
            background: #f5f5f5;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }
        .result-item h3 { color: #667eea; margin-bottom: 8px; }
        .result-item p { color: #666; line-height: 1.5; }
        .empty { text-align: center; color: #999; padding: 40px 20px; }
